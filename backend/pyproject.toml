[project]
name = "birdography-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "exifread>=3.0",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pillow>=11",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
