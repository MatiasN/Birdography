[project]
name = "birdography-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.6",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0",
    "tzdata>=2026.6",
    "tzfpy>=2.1.2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["exiftool: needs the ExifTool binary; skipped when it is not installed"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = true
