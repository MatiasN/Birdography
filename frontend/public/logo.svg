    <clipPath id="bird">
      <circle cx="40" cy="20" r="10"/>
      <ellipse cx="31" cy="34" rx="10.5" ry="16" transform="rotate(32 31 34)"/>
    </clipPath>
  </defs>
  <path d="M5 51.5H57" stroke="#7a5a40" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M45 51.5l5.5-5.5" stroke="#7a5a40" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M22.5 41.5L11 54.5l4.5 2L27 45z" fill="#135a85"/>
  <path d="M27.5 44.5v6.5M32 43v8" stroke="#f07c2c" stroke-width="2" stroke-linecap="round"/>
  <g clip-path="url(#bird)">
    <rect width="64" height="64" fill="#1d80b8"/>
