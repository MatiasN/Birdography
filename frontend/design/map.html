<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mockup: Map</title>
    <script type="module">
      import { icon, MAP_ATTRIBUTION, MAP_ZOOM, page, photo, tiles, ui } from "./shell.js";

      // Groups show a count, single photos their thumbnail (plan 0004 Part F); the open group is ringed.
      const MARKERS = [
        [38.705, -9.02, 12, true],
        [38.77, -8.98, 48],
        [38.66, -9.2, 5],
        [38.74, -9.14, 23],
        [38.82, -9.1, 3],
        [38.6, -9.0, 1, false, 3],
        [38.69, -8.9, 1, false, 8],
        [38.8, -9.25, 7],
        [38.62, -9.1, 1, false, 11],
        [38.88, -8.97, 15],
        [38.56, -8.87, 1, false, 14],
        [38.73, -8.8, 4],
      ];

      const panel = `
        <aside aria-label="12 photos here" class="hidden md:flex md:h-dvh md:w-[420px] md:shrink-0 md:flex-col md:border-l md:bg-card">
          <div class="flex h-14 items-center gap-2 border-b px-4">
            <h2 class="flex-1 font-semibold">12 photos here</h2>
            <button class="${ui.outline} h-8">${icon("zoomIn", "size-4")}Zoom in</button>
            <span class="${ui.iconButton}" aria-label="Close">${icon("x")}</span>
          </div>
          <div class="grid grid-cols-3 gap-2 overflow-y-auto p-4">
            ${Array.from({ length: 12 }, (_, i) => `<span class="aspect-square rounded-lg" style="background:${photo(i * 3 + 1)}"></span>`).join("")}
          </div>
        </aside>`;

      page(() => {
        const main = document.querySelector("main");
        main.innerHTML = `<div id="map" class="relative min-h-[calc(100dvh-7.5rem)] flex-1 md:min-h-dvh">${MAP_ZOOM}${MAP_ATTRIBUTION}</div>${panel}`;
        const map = document.getElementById("map");
        const { toPx } = tiles(map, { lat: 38.73, lon: -9.04, zoom: 11 });
        for (const [lat, lon, count, open, n] of MARKERS) {
          const [x, y] = toPx(lat, lon);
          const body =
            count === 1
              ? `<span class="block size-10 rounded-full border-2 border-white bg-cover shadow-md" style="background:${photo(n)}"></span>`
              : `<span class="grid size-10 place-items-center rounded-full border-2 border-white bg-primary text-xs font-semibold text-primary-foreground shadow-md ${
                  open ? "ring-4 ring-primary/40" : ""
                }">${count}</span>`;
          map.insertAdjacentHTML(
            "beforeend",
            `<span class="absolute z-10 -translate-1/2" style="left:${x}px;top:${y}px">${body}</span>`,
          );
        }
      });
    </script>
  </head>
  <body data-tab="map" data-title="Map">
    <main class="flex flex-1"></main>
  </body>
</html>
