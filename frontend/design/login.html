<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mockup: Login</title>
    <script type="module">
      import { logo, page, ui } from "./shell.js";

      page(() => {
        document.querySelector("main").innerHTML = `
          <div class="flex w-full max-w-sm flex-col items-center gap-6">
            <div class="flex flex-col items-center gap-2 text-center">${logo("size-20")}
              <h1 class="text-2xl font-semibold tracking-tight">Birdography</h1>
              <p class="text-sm text-muted-foreground">Your bird photography catalogue</p></div>
            <form class="${ui.card} w-full space-y-4 p-6">
              <label class="block space-y-1.5"><span class="${ui.label}">Email</span>
                <input type="email" class="${ui.input}" value="matias@example.org"></label>
              <label class="block space-y-1.5"><span class="${ui.label}">Password</span>
                <input type="password" class="${ui.input}" value="xxxxxxxxxxxx"></label>
              <button class="${ui.button} w-full">Log in</button>
            </form>
          </div>`;
      });
    </script>
  </head>
  <body data-bare>
    <main class="flex min-h-dvh items-center justify-center p-4"></main>
  </body>
</html>
