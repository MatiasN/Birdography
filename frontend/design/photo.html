<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mockup: photo detail</title>
    <script type="module">
      import { icon, MAP_ATTRIBUTION, page, photo, SPECIES, tiles, ui } from "./shell.js";
      import { catalogue } from "./catalogue.js";

      const chip = ([en, pt, sci]) => `
        <span class="inline-flex items-center gap-2 rounded-lg border bg-secondary py-1.5 pl-3 pr-1.5 text-sm">
          <span><span class="font-medium">${en}</span>
            <span class="block text-xs text-muted-foreground">${pt} · <i>${sci}</i></span></span>
          <span class="${ui.iconButton} size-7" aria-label="Remove">${icon("x", "size-4")}</span></span>`;

      const row = (label, value) =>
        `<div class="grid grid-cols-[6.5rem_1fr] gap-2 py-1.5"><dt class="text-muted-foreground">${label}</dt><dd>${value}</dd></div>`;

      // Wide: a panel beside the grid. Narrow: the same panel as a full-screen sheet over the page and its tab bar.
      const detail = `
        <aside aria-label="Photo details" class="fixed inset-0 z-30 flex flex-col overflow-y-auto bg-background md:sticky md:top-0 md:z-0 md:h-dvh md:w-[420px] md:shrink-0 md:border-l md:bg-card">
          <div class="sticky top-0 z-10 flex h-14 items-center gap-2 border-b bg-inherit px-2 md:px-4">
            <span class="${ui.iconButton} md:hidden" aria-label="Back">${icon("arrowLeft")}</span>
            <h2 class="flex-1 truncate font-semibold">Common kingfisher</h2>
            <span class="${ui.iconButton.replace("inline-flex ", "")} hidden md:inline-flex" aria-label="Close">${icon("x")}</span>
          </div>
          <span class="block aspect-[3/2] w-full shrink-0" style="background:${photo(0)}"></span>
          <div class="space-y-6 p-4">
            <section class="space-y-2">
              <h3 class="${ui.label}">Species</h3>
              <div class="flex flex-wrap gap-2">${chip(SPECIES[0])}
                <button class="${ui.ghost} text-primary">${icon("plus", "size-4")}Add species</button></div>
            </section>
            <section>
              <h3 class="${ui.label} mb-1">Details</h3>
              <dl class="divide-y text-sm">
                ${row("Taken", `14 Nov 2026, 08:42 <span class="text-muted-foreground">UTC+00:00</span>`)}
                ${row("Camera", "Nikon Z 8")}
                ${row("Lens", "NIKKOR Z 600mm f/6.3 VR S")}
                ${row("Settings", "ISO 800 · f/6.3 · 1/2000 s · 600 mm")}
                ${row("File", "NEF, 8256 × 5504 · 52.3 MB")}
              </dl>
            </section>
            <section class="space-y-2">
              <h3 class="${ui.label}">Where</h3>
              <p class="text-sm text-muted-foreground">Position from the camera's GPS. Click the map to change it.</p>
              <div id="mini" class="relative h-48 overflow-hidden rounded-lg border">${MAP_ATTRIBUTION}</div>
              <div class="flex gap-2"><button class="${ui.button}" disabled style="opacity:.5">Use this spot</button></div>
            </section>
          </div>
        </aside>`;

      page(() => {
        const main = document.querySelector("main");
        main.innerHTML = `<div class="min-w-0 flex-1 p-4 md:p-6 xl:p-8">${catalogue({ selected: 0, narrowGrid: true })}</div>${detail}`;
        const mini = document.getElementById("mini");
        const { toPx } = tiles(mini, { lat: 38.705, lon: -9.02, zoom: 13 });
        const [x, y] = toPx(38.705, -9.02);
        mini.insertAdjacentHTML(
          "beforeend",
          `<span class="absolute z-10 size-4 -translate-1/2 rounded-full border-2 border-white bg-primary shadow" style="left:${x}px;top:${y}px"></span>`,
        );
      });
    </script>
  </head>
  <body data-tab="catalogue" data-title="Catalogue">
    <main class="flex flex-1"></main>
  </body>
</html>
