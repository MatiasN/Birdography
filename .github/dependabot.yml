# Weekly dependency update PRs, one grouped PR per ecosystem for minor and patch bumps, majors on their own.
# `cooldown` holds every version update back until the release is 2 days old, so a hijacked package that gets
# yanked within hours never reaches a PR. Security updates (enabled in the repository settings under Dependabot)
# are NOT delayed by cooldown: a fix for a known vulnerability arrives immediately.
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 2

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
