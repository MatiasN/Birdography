name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: postgis/postgis:18-3.7
        env:
          POSTGRES_USER: birdography
          POSTGRES_PASSWORD: birdography
          POSTGRES_DB: birdography
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-retries 10
    # Every required setting, as the app sees it in production. pytest switches POSTGRES_DB to birdography_test
    # itself (tests/conftest.py); the alembic steps below use this one.
    env:
      POSTGRES_DB: birdography
      POSTGRES_USER: birdography
      POSTGRES_PASSWORD: birdography
      POSTGRES_HOST: localhost
      SECRET_KEY: ci-only-secret-key-at-least-32-characters
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
      # Pinned release, the same as in the Docker image; the Ubuntu package lags behind.
      - run: sudo python3 -I scripts/install_exiftool.py
      - run: exiftool -ver
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov
      - run: uv run alembic upgrade head
      - run: uv run alembic check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The production stack, as users run it: images build, services start unprivileged with a photo directory owned
  # by someone else, only the UI is published, and a backup survives losing everything.
  deploy:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.yml
      BIND_ADDRESS: 127.0.0.1
    steps:
      - uses: actions/checkout@v7
      - name: Shell scripts
        run: shellcheck scripts/*.sh backend/fix-permissions.sh frontend/real-ip.sh
      - name: Configure
        run: |
          cp .env.example .env
          sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 24)/" .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=$(openssl rand -hex 32)/" .env
          mkdir -p data/photos  # owned by the runner (uid 1001); the backend's entrypoint hands it to uid 1000
      - name: Start
        run: $COMPOSE up -d --build --wait
      - name: Only the UI is published
        run: |
          $COMPOSE ps --format '{{.Service}} {{.Ports}}' | tee ports
          grep -q '^frontend 127.0.0.1:3000->8080/tcp' ports
          if grep -E '^(backend|db) .*->' ports; then echo 'backend or db is published'; exit 1; fi
          test "$($COMPOSE exec -T backend stat -c %u /proc/1)" = 1000  # the server process, not the exec
          curl -fsS localhost:3000/api/health
      - name: Seed
        run: |
          $COMPOSE exec -T backend python -c "
          from sqlalchemy.orm import Session
          from app.auth import create_user
          from app.db import engine
          with Session(engine) as db: create_user(db, 'ci@example.com', 'ci-password-123')"
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"email": "ci@example.com", "password": "ci-password-123"}' localhost:3000/api/auth/login
          curl -fsS -b jar -F file=@backend/tests/fixtures/raw/sony_ilce_7s.arw localhost:3000/api/photos
      - name: Back up, lose everything, restore
        run: |
          scripts/backup.sh /tmp/backups
          $COMPOSE down -v
          sudo rm -rf data/photos
          $COMPOSE up -d --wait
          scripts/restore.sh /tmp/backups/birdography-*
      - name: Restored
        run: |
          curl -fsS -c jar -H 'Content-Type: application/json' \
            -d '{"email": "ci@example.com", "password": "ci-password-123"}' localhost:3000/api/auth/login
          curl -fsS -b jar 'localhost:3000/api/photos/1/file?kind=original' -o restored.arw
          cmp restored.arw backend/tests/fixtures/raw/sony_ilce_7s.arw
      # A backup from the PostGIS 17 image (used until November 2026) restores on the current one: its dump names
      # extensions the 18 image no longer has, which restore.sh skips. See scripts/fixtures/backup-pg17/README.md.
      - name: Restore a PostgreSQL 17 backup
        run: |
          scripts/restore.sh --force scripts/fixtures/backup-pg17 2>&1 | tee restore17.log
          grep -q 'Skipping extension postgis_tiger_geocoder' restore17.log
          test "$($COMPOSE exec -T db psql -X -tA -U birdography -d birdography -c 'SELECT count(*) FROM users')" = 1
          curl -fsS -c jar17 -H 'Content-Type: application/json' \
            -d '{"email": "fixture@example.com", "password": "fixture-password-123"}' localhost:3000/api/auth/login
      # scripts/dev.sh from a clean checkout: generated settings, seeded photos on the map, on its own ports.
      - name: Dev stack
        run: |
          scripts/dev.sh up --photos 20
          curl -fsS -c devjar -H 'Content-Type: application/json' \
            -d '{"email": "dev@birdography.local", "password": "birdography-dev"}' localhost:3001/api/auth/login
          points=$(curl -fsS -b devjar localhost:3001/api/photos/points | python3 -c 'import json, sys; print(len(json.load(sys.stdin)))')
          echo "$points photos on the map"
          test "$points" -ge 15  # 20 minus the few without GPS
          scripts/dev.sh down --volumes
      - name: Logs
        if: failure()
        run: |
          $COMPOSE logs
          docker compose -p birdography-dev logs
