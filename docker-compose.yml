services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    env_file: .env
    # Not published: only the backend talks to it. compose.override.yml publishes it on localhost for development.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # The entrypoint hands the photo directory to this user and group, then runs the backend as them.
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      UPLOAD_DIR: /data/photos
    # Not published: nginx in the frontend container is its only client, and the login throttle trusts the client
    # address nginx forwards. compose.override.yml publishes it on localhost for development.
    volumes:
      - ${UPLOAD_DIR:-./data/photos}:/data/photos
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      start_interval: 2s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-75m}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      # Reachable from other devices on the network by default; BIND_ADDRESS=127.0.0.1 keeps it to this machine.
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-3000}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
